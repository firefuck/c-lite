# A pushed tag v<version> publishes a GitHub Release with the wheel, the sdist and the desktop
# installers attached.
#
# Cut the tag with scripts/release.py (it checks that the tag, __version__, pyproject.toml and
# CHANGELOG.md agree). Nothing is uploaded to PyPI: `clite` there belongs to another project
# and the distribution here is `c-lite`, installed from the release assets.
#
# NOT VERIFIED: this workflow has not run on GitHub yet. The same build, wheel check and
# clean-venv install were run locally on 2026-10-06; the Linux AppImage was built locally on
# 2026-10-09 and the macOS and Windows installers have not been built at all.
name: release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install "build>=1.2,<2"
      - name: Tag, version and changelog agree
        run: python scripts/release.py check --tag "$GITHUB_REF_NAME"
      - name: Build wheel and sdist and check the wheel contents
        run: python scripts/release.py build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      # The checkout is only for scripts/check_wheel_install.py; nothing is installed from it.
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Install the wheel into a clean virtualenv
        run: |
          python -m venv "$RUNNER_TEMP/release-venv"
          "$RUNNER_TEMP/release-venv/bin/python" -m pip install dist/*.whl
      - name: clite --version matches the tag, and clite doctor passes
        working-directory: ${{ runner.temp }}
        env:
          HOME: ${{ runner.temp }}/home
          CLITE_HOME: ${{ runner.temp }}/home/.clite
        run: |
          mkdir -p "$CLITE_HOME"
          printf 'model:\n  provider: mock\n  default: mock-1\n' > "$CLITE_HOME/config.yaml"
          version="$("$RUNNER_TEMP/release-venv/bin/clite" --version)"
          echo "$version"
          test "$version" = "C-lite ${GITHUB_REF_NAME#v}"
          "$RUNNER_TEMP/release-venv/bin/clite" doctor
      - name: Exercise the installed package outside the checkout
        working-directory: ${{ runner.temp }}
        run: '"$RUNNER_TEMP/release-venv/bin/python" -I "$GITHUB_WORKSPACE/scripts/check_wheel_install.py"'
      - name: pipx installs the wheel file
        run: |
          pipx install --python "$(command -v python)" dist/*.whl
          clite --version

  desktop:
    needs: build
    # One runner per system: an installer can only be built on the system it installs on.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: --linux
          - os: macos-latest
            target: --mac
          - os: windows-latest
            target: --win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: npm ci
      # The name and version in the installer have to be the package's, so they are checked
      # before anything is built.
      - name: The installer agrees with the Python package
        run: node --test apps/desktop/test/packaging.test.ts
      - run: npm run build --workspace apps/desktop
      - name: Build the installer
        working-directory: apps/desktop
        env:
          # No certificate in CI: build unsigned rather than fail. A certificate in the
          # repository secrets is picked up when it is there.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GH_TOKEN: ${{ github.token }}
        run: npx electron-builder ${{ matrix.target }} --config electron-builder.config.cjs --publish never
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.os }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
          if-no-files-found: error

  publish:
    needs: [test, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: desktop
          merge-multiple: true
      - name: Create the GitHub Release with the wheel, the sdist and the installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release.py notes > "$RUNNER_TEMP/notes.md"
          # Say it plainly: without a certificate these installers are not signed, and the
          # system will warn about them. Better in the notes than in a surprise.
          if [ -z "${{ secrets.MAC_CSC_LINK }}" ]; then
            printf '\n---\n\n**The desktop installers are unsigned.** macOS Gatekeeper and Windows\nSmartScreen will warn about them; the source is in this repository if you want to build\nyour own.\n' >> "$RUNNER_TEMP/notes.md"
          fi
          gh release create "$GITHUB_REF_NAME" dist/*.whl dist/*.tar.gz desktop/* \
            --title "C-lite ${GITHUB_REF_NAME#v}" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
