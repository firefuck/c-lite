# Publish the user documentation site to GitHub Pages.
#
# It runs when a release is published, so the site always matches the release that was just cut,
# and it can be run by hand from the Actions tab when only the prose changed.
#
# NOT VERIFIED: this workflow has not run on GitHub yet. What it does was run locally on
# 2026-10-10 (`python scripts/gen_docs.py --target site --check` and
# `python scripts/build_site.py`), and the artefact it uploads is the same plain directory of
# HTML and CSS.
name: docs

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The reference pages in the site match the code
        run: python scripts/gen_docs.py --target site --check
      - name: Build the site
        run: python scripts/build_site.py --out website/build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
