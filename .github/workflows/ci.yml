# Every push and pull request runs the same checks as scripts/run_tests.sh.
#
# NOT VERIFIED: this workflow was written without a GitHub Actions run to confirm it. The
# commands are the ones that pass locally; the runner setup around them is what to check on
# the first run (see docs/roadmap, task F1-T1).
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests scripts
      - run: mypy
      - run: pytest tests -q

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The TypeScript tests start the real Python backend.
      - run: pip install -e .
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      # Whether the committed bundle is stale is checked by the Python suite (it compares a
      # hash of the sources), so this step only proves the bundle still builds.
      - run: npm run build --workspace ui-tui
