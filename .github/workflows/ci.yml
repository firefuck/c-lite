# Every push and pull request runs the same checks as scripts/run_tests.sh.
#
# Python 3.11-3.13 and Node were verified in the target repository on 2026-10-06.
# The wheel job also checks package data and entry points outside the checkout.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pip install -e ".[dev]"
      - run: ruff check src tests scripts
      - run: mypy
      - run: pytest tests -q

  windows:
    # The suite on Windows: file locks, cmd.exe and Git Bash, taskkill, %LOCALAPPDATA% home.
    # Lint and type checks are platform-independent and stay in the python job.
    #
    # The Windows port is behind the other platforms (39 failures at the last honest run:
    # text-mode writes double the carriage returns, SIGTERM-based tests, chmod-mode asserts),
    # so its failures are reported but do not gate the run. Turn this off once the suite
    # passes there.
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pip install -e ".[dev]"
      - run: pytest tests -q

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The TypeScript tests start the real Python backend.
      - run: pip install -e ".[dev]"
      - run: npm ci
      # The desktop smoke test opens the real Electron window, so the runner needs a display.
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: xvfb-run -a scripts/run_tests.sh
      # Whether the committed bundle is stale is checked by the Python suite (it compares a
      # hash of the sources), so this step only proves the bundle still builds.
      - run: npm run build

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the distributable wheel
        run: python -m pip wheel --no-deps . --wheel-dir dist
      - name: Install into a clean virtualenv
        run: |
          python -m venv "$RUNNER_TEMP/clite-wheel"
          "$RUNNER_TEMP/clite-wheel/bin/python" -m pip install dist/*.whl
      - name: Exercise the installed package outside the checkout
        working-directory: ${{ runner.temp }}
        run: '"$RUNNER_TEMP/clite-wheel/bin/python" -I "$GITHUB_WORKSPACE/scripts/check_wheel_install.py"'
