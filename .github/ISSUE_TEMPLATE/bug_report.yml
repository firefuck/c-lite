name: Laporan bug
description: Sesuatu tidak berjalan seperti yang dijanjikan dokumentasi.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Celah keamanan jangan dilaporkan di sini; ikuti SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: Apa yang terjadi
      description: Apa yang Anda lakukan, apa yang Anda harapkan, dan apa yang terjadi.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Cara mereproduksi
      description: Langkah sekecil mungkin. Provider `mock` membantu bila masalahnya bukan di provider.
      placeholder: |
        1. python -m clite chat -q "..." --provider mock
        2. ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Lingkungan
      description: Keluaran `clite doctor` dan `clite --version`. Hapus kunci atau token sebelum menempel.
      render: text
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Antarmuka
      multiple: true
      options: [CLI, TUI, Dashboard, Desktop, Gateway, Cron, ACP, Lainnya]
  - type: textarea
    id: logs
    attributes:
      label: Log
      description: Bagian relevan dari `clite logs` atau keluaran galat, tanpa rahasia.
      render: text
